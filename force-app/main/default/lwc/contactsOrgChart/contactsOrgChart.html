<template>
    <div class="slds-grid slds-gutters">
        <!-- Hierarchy Tree -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <lightning-card title="Agency / Office Hierarchy" icon-name="standard:account">
                <div class="slds-p-around_small">
                    <template for:each={hierarchy} for:item="node">
                        <div key={node.id} class="slds-m-bottom_x-small" style={node.style}>
                            <lightning-icon icon-name="utility:folder" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                            {node.name}
                            <span class="slds-badge slds-m-left_x-small">{node.count}</span>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </div>

        <!-- Contacts Table -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
            <lightning-card title="Senior Decision-Maker Contacts" icon-name="standard:contact">
                <div class="slds-p-around_medium">
                    <lightning-datatable
                        key-field="id"
                        data={contacts}
                        columns={contactColumns}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </lightning-card>
        </div>

        <!-- Agent-style panel -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <lightning-card title="Research & Relationship Agent" icon-name="custom:custom19">
                <div class="slds-p-around_medium">
                    <p class="slds-text-body_small slds-m-bottom_medium">AI Agent for Government Relations</p>
                    <h3 class="slds-text-heading_small">Key Influencers Identified</h3>
                    <template for:each={influencers} for:item="inf">
                        <div key={inf.id} class="slds-m-bottom_small">
                            <strong>{inf.name}</strong><br/>
                            <span class="slds-text-color_weak">{inf.role}</span>
                        </div>
                    </template>
                    <h3 class="slds-text-heading_small slds-m-top_medium">Recommended Call Plan</h3>
                    <template for:each={callPlan} for:item="plan">
                        <div key={plan.id} class="slds-m-bottom_small">
                            <strong>{plan.name}</strong><br/>
                            <span class="slds-text-color_weak">{plan.objective}</span>
                        </div>
                    </template>
                </div>
            </lightning-card>
        </div>
    </div>
</template>
