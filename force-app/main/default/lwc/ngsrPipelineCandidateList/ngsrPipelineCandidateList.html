<template>
    <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium">
        <!-- Top 5 Best-Fit -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="slds-card">
                <div class="slds-card__body slds-card__body_inner">
                    <h3 class="slds-text-heading_small">Top 5 Best-Fit Leads</h3>
                    <p class="slds-text-color_weak slds-m-bottom_small">AI relevancy 85+</p>
                    <template for:each={topFive} for:item="item">
                        <div key={item.Id} class="slds-grid slds-grid_align-spread slds-m-bottom_x-small">
                            <span class="slds-truncate">{item.Name}</span>
                            <span class="slds-badge slds-theme_success">{item.AI_Relevancy_Score__c}</span>
                        </div>
                    </template>
                </div>
            </article>
        </div>
        <!-- Total Value -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="slds-card">
                <div class="slds-card__body slds-card__body_inner">
                    <h3 class="slds-text-heading_small">Total Pipeline Value</h3>
                    <p class="slds-text-heading_large">
                        <lightning-formatted-number value={totalValue} format-style="currency" currency-code="USD"></lightning-formatted-number>
                    </p>
                    <p class="slds-text-color_weak">{candidates.length} candidates</p>
                </div>
            </article>
        </div>
        <!-- High Score Alerts -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="slds-card">
                <div class="slds-card__body slds-card__body_inner">
                    <h3 class="slds-text-heading_small">New High-Score Alerts</h3>
                    <p class="slds-text-heading_large slds-text-color_success">{highScoreCount}</p>
                    <p class="slds-text-color_weak">Score ≥ 90</p>
                </div>
            </article>
        </div>
        <!-- Pipeline Health -->
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <article class="slds-card">
                <div class="slds-card__body slds-card__body_inner">
                    <h3 class="slds-text-heading_small">Pipeline Health</h3>
                    <p class="slds-text-heading_medium slds-text-color_success">Strong</p>
                    <p class="slds-text-color_weak">Balanced coverage across agencies</p>
                </div>
            </article>
        </div>
    </div>

    <lightning-card title="Opportunities" icon-name="standard:opportunity">
        <div slot="actions">
            <span class="slds-text-body_small slds-m-right_small">Sorted by AI Relevancy Score</span>
        </div>
        <div class="slds-p-around_medium">
            <template if:true={candidates.length}>
                <lightning-datatable
                    key-field="Id"
                    data={candidates}
                    columns={columns}
                    hide-checkbox-column
                    onrowaction={handleRowAction}>
                </lightning-datatable>
            </template>
            <template if:true={error}>
                <div class="slds-text-color_error">Unable to load Pipeline Candidates.</div>
            </template>
            <template if:false={candidates.length}>
                <div class="slds-text-color_weak slds-p-around_medium">No Pipeline Candidates found. Load sample data or connect external sources.</div>
            </template>
        </div>
    </lightning-card>
</template>
