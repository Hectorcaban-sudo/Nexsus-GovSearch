<template>
    <div class="wrap">
        <div class="sidebar">
            <h3>Agency / Office Hierarchy</h3>
            <ul class="tree">
                <li>Department of Defense
                    <ul>
                        <li>Army
                            <ul>
                                <li>Headquarters, Department of the Army</li>
                                <li>ASA (ALT)
                                    <ul>
                                        <li class="active">Program Executive Office (PEO) C3T</li>
                                        <li>PM Mission Command</li>
                                        <li>PM Tactical Network</li>
                                        <li>PM Enterprise Information Systems</li>
                                    </ul>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
        <div class="main">
            <h2>Contacts and Agency Org Chart</h2>
            <div class="tabs"><span class="tab active">Contacts</span><span class="tab">Org Chart</span></div>
            <div class="contact-list">
                <template for:each={contacts} for:item="c">
                    <div key={c.id} class="contact">
                        <div class="avatar">{c.initials}</div>
                        <div class="info">
                            <div class="cname">{c.name}</div>
                            <div class="ctitle">{c.title}</div>
                            <div class="cbio">{c.bio}</div>
                        </div>
                        <div class="influence">
                            <div class="stars">{c.stars}</div>
                            <div class="ilabel">{c.influence}</div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="org">
                <h3>Program Executive Office (PEO) C3T – Org Chart</h3>
                <div class="org-box">PEO C3T<br/>Laura A. Dean</div>
                <div class="org-row">
                    <div class="org-box">Deputy PEO<br/>Michael J. Talley</div>
                    <div class="org-box">Chief of Staff<br/>Jennifer K. Pucino</div>
                    <div class="org-box">PM Tactical Network<br/>David R. Lewis</div>
                </div>
            </div>
        </div>
        <div class="agent">
            <div class="agent-header">Agentforce<br/>Research &amp; Relationship Agent</div>
            <div class="agent-body">
                <h4>Suggested Key Influencers</h4>
                <template for:each={contacts} for:item="c">
                    <div key={c.id} class="sug">
                        <span class="av">{c.initials}</span>
                        <span>{c.name}</span>
                        <span class="stars">{c.stars}</span>
                    </div>
                </template>
                <h4>Recommended Call Plan</h4>
                <ol>
                    <li>Opening: Reference PEO C3T priorities for tactical network modernization.</li>
                    <li>Value: Highlight how our solution accelerates interoperability goals.</li>
                    <li>Next Step: Request a 30-min technical deep dive with PM Tactical Network.</li>
                </ol>
            </div>
        </div>
    </div>
</template>
