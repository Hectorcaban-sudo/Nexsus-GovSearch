<template>
    <lightning-card title="AI Opportunity Brief" icon-name="custom:custom19">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <p class="slds-text-title_caps">AI Relevancy Score</p>
                    <p class="slds-text-heading_large {scoreClass}">{score}</p>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <p class="slds-text-title_caps">Strategic Fit</p>
                    <p class="slds-text-heading_medium">{strategicFit}</p>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                    <p class="slds-text-title_caps">Pursuit Priority</p>
                    <p class="slds-text-heading_medium">{priority}</p>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                    <p class="slds-text-title_caps">Incumbent</p>
                    <p>{incumbent}</p>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-top_small">
                    <p class="slds-text-title_caps">NAICS Tags</p>
                    <p>{naics}</p>
                </div>
            </div>
            <div class="slds-m-top_medium slds-border_top slds-p-top_medium">
                <p class="slds-text-title_caps">AI Brief Summary</p>
                <div class="slds-m-top_small">
                    <lightning-formatted-rich-text value={brief}></lightning-formatted-rich-text>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
